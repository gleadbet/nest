<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Nest Thermostat Control</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script>
    // Add error handling for script loading
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error('Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\nError object: ' + JSON.stringify(error));
      return false;
    };

    // Add loading state check
    console.log('Initializing application...');
    console.log('Page load time:', new Date().toISOString());
    
    window.addEventListener('load', function() {
      console.log('Page fully loaded at:', new Date().toISOString());
      if (!window.React) {
        console.error('React not loaded!');
        document.getElementById('root').innerHTML = '<div class="p-4"><h1 class="text-2xl font-bold text-red-500">Error Loading Application</h1><p>React failed to load. Please check the console for errors.</p></div>';
      } else {
        console.log('React loaded successfully');
      }
    });
    
    // Add script loading error handling
    window.addEventListener('error', function(e) {
      console.error('Script loading error:', e);
    });
  </script>
</head>
<body>
  <!-- Empty div for React to mount into -->
  <div id="root"></div>
  
  <!-- Load React first -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Then load our bundle -->
  <script>
    // Add cache-busting parameter to force reload of bundle
    console.log('Loading bundle with cache-busting...');
    const script = document.createElement('script');
    script.src = '/static/bundle.js?v=' + Date.now() + '&v=1.2.2'; // Force new version
    console.log('Bundle URL:', script.src);
    
    script.onload = function() {
      console.log('Bundle loaded successfully at:', new Date().toISOString());
    };
    
    script.onerror = function() {
      console.error('Failed to load bundle at:', new Date().toISOString());
    };
    
    document.body.appendChild(script);
  </script>
</body>
</html>
